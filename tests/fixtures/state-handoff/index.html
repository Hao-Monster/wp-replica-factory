<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Owned Fixture Store - State Handoff</title>
  <link rel="stylesheet" href="assets/store.css" />
</head>
<body>
  <header class="store-header">
    <div class="header-inner">
      <div class="brand">Replica Fixture Store</div>
      <nav class="header-nav">
        <!-- Normal region trigger button -->
        <button id="region-trigger-btn" class="region-btn" type="button" aria-haspopup="dialog" aria-expanded="false">
          <span class="region-globe">🌐</span>
          <span class="region-label">Region / Language</span>
        </button>
        <!-- Broken button for negative testing -->
        <button id="broken-region-btn" class="region-btn broken-btn" type="button">
          <span>⚠️ Broken Trigger</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="store-main">
    <section class="hero-section">
      <h1>Autonomous Framework Verification</h1>
      <p>Demonstrating explicit interactive state completeness and original resource handoff.</p>
    </section>
  </main>

  <script>
    (function() {
      var portalEl = null;

      function createPortal() {
        if (portalEl) return portalEl;
        portalEl = document.createElement('div');
        portalEl.id = 'region-portal';
        portalEl.className = 'portal-overlay';
        portalEl.setAttribute('role', 'dialog');
        portalEl.setAttribute('aria-modal', 'true');
        portalEl.innerHTML = [
          '<div class="portal-dialog">',
          '  <div class="dialog-header">',
          '    <h2 class="region-title">Select Region &amp; Language</h2>',
          '    <button id="region-close-btn" class="close-btn" type="button" aria-label="Close">',
          '      <svg class="close-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">',
          '        <line x1="18" y1="6" x2="6" y2="18"></line>',
          '        <line x1="6" y1="6" x2="18" y2="18"></line>',
          '      </svg>',
          '    </button>',
          '  </div>',
          '  <div class="dialog-body">',
          '    <div class="active-region">',
          '      <img class="flag-img" src="assets/region-flag.svg" alt="Region Flag" width="32" height="24" />',
          '      <span class="region-name">North America (Universal Fixture)</span>',
          '    </div>',
          '    <div class="secondary-section">',
          '      <button id="lang-dropdown-btn" class="lang-toggle-btn" type="button" aria-expanded="false">',
          '        <span>Available Languages</span>',
          '        <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">',
          '          <polyline points="6 9 12 15 18 9"></polyline>',
          '        </svg>',
          '      </button>',
          '      <ul id="lang-list" class="lang-list hidden" style="display: none;">',
          '        <li class="lang-item active" data-lang="en">English (Universal)</li>',
          '        <li class="lang-item" data-lang="fr">Français (Universal)</li>',
          '        <li class="lang-item" data-lang="es">Español (Universal)</li>',
          '      </ul>',
          '    </div>',
          '  </div>',
          '</div>'
        ].join('\n');

        portalEl.querySelector('#region-close-btn').addEventListener('click', function() {
          closePortal();
        });

        portalEl.querySelector('#lang-dropdown-btn').addEventListener('click', function() {
          var list = portalEl.querySelector('#lang-list');
          var isExpanded = list.style.display !== 'none';
          if (isExpanded) {
            list.style.display = 'none';
            list.classList.add('hidden');
            this.setAttribute('aria-expanded', 'false');
          } else {
            list.style.display = 'block';
            list.classList.remove('hidden');
            this.setAttribute('aria-expanded', 'true');
          }
        });

        return portalEl;
      }

      function openPortal() {
        var el = createPortal();
        if (!document.body.contains(el)) {
          document.body.appendChild(el);
        }
        document.getElementById('region-trigger-btn').setAttribute('aria-expanded', 'true');
      }

      function closePortal() {
        if (portalEl && document.body.contains(portalEl)) {
          document.body.removeChild(portalEl);
        }
        portalEl = null;
        document.getElementById('region-trigger-btn').setAttribute('aria-expanded', 'false');
      }

      document.getElementById('region-trigger-btn').addEventListener('click', function() {
        openPortal();
      });

      document.getElementById('broken-region-btn').addEventListener('click', function() {
        console.log('Broken trigger clicked; state not modified');
      });
    })();
  </script>
</body>
</html>
