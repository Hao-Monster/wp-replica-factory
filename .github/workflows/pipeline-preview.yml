name: Reference Pipeline Preview & Quality Gate

on:
  push:
    branches:
      - feat/reference-pipeline-mvp
      - main
    paths:
      - 'tools/pipeline/**'
      - 'tools/downloader/**'
      - 'tests/fixtures/pipeline-site/**'
      - '.github/workflows/pipeline-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'github-pages'
  cancel-in-progress: false

jobs:
  build-preview:
    name: Build Reference Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'

      - name: Install locked dependencies and Chromium
        run: |
          npm ci --prefix tools/downloader --ignore-scripts --no-audit --no-fund
          node tools/downloader/node_modules/playwright/cli.js install --with-deps chromium

      - name: Verify CLI --help
        run: node tools/pipeline/cli.mjs --help

      - name: Build pipeline preview artifacts
        id: build
        run: |
          node tools/pipeline/build-preview.mjs --output dist-preview --sha ${{ github.sha }} --run-id ${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist-preview

      - name: Upload backup preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-artifact-${{ github.run_id }}
          path: dist-preview
          retention-days: 14

  deploy-preview:
    name: Deploy Preview to GitHub Pages
    needs: build-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  quality-checks:
    name: Full Pipeline Quality Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.replica/browsers
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'

      - name: Install locked dependencies and Chromium
        run: |
          npm ci --prefix tools/downloader --ignore-scripts --no-audit --no-fund
          node tools/downloader/node_modules/playwright/cli.js install --with-deps chromium

      - name: Verify CLI --help
        run: node tools/pipeline/cli.mjs --help

      - name: Build pipeline preview for acceptance tests
        run: node tools/pipeline/build-preview.mjs --output dist-preview --sha ${{ github.sha }} --run-id ${{ github.run_id }}

      - name: Pipeline test suite (U1-U3, P1-P7, N1-N8, G1-G2)
        run: node --test tests/pipeline/pipeline.test.mjs
        timeout-minutes: 8

      - name: Offline export browser acceptance tests (E1-E10)
        run: node --test tests/pipeline/export-offline-browser.test.mjs
        timeout-minutes: 5

      - name: Evidence adapter verification tests (V1-V4)
        run: node --test tests/pipeline/adapt-evidence.test.mjs

      - name: Collect sanitized pipeline CI evidence
        if: always()
        run: python tests/pipeline/collect-pipeline-evidence.py

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-evidence-${{ github.run_id }}
          path: .replica/pipeline-ci-evidence/
          retention-days: 7
