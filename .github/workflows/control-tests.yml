name: Framework checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: framework-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  control-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, pinned
        with:
          python-version: '3.13'
      - name: Check tracked filenames (not a full secret scan)
        run: python3 scripts/check_repo_files.py
      - name: Run local unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate sanitized example
        run: python3 scripts/replica.py validate --project examples/project.example.json

  fixture-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a # v5.0.0, pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83cb11b83ae66e0230d6156d7c80228e7c # v6.0.0, pinned
        with:
          python-version: '3.13'
      - name: Install locked fixture browser dependency
        run: python -m pip install --requirement requirements-fixture.txt
      - name: Install locked Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run fixture lifecycle and browser acceptance
        run: |
          python -X utf8 scripts/fixture_site.py seed
          python -X utf8 scripts/fixture_site.py test | tee fixture-test-output.json
      - name: Run fixture unit and control tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Upload fixture evidence
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3, pinned
        with:
          name: owned-fixture-evidence
          path: fixture-test-output.json
          retention-days: 7
