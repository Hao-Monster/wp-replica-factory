name: Reference Pipeline MVP checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reference-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.replica/browsers
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.12.0'

      - name: Install locked project dependencies and Chromium build
        run: |
          npm ci --prefix tools/downloader --ignore-scripts --no-audit --no-fund
          node tools/downloader/node_modules/playwright/cli.js install --with-deps chromium

      - name: Verify CLI --help is runnable
        run: node tools/pipeline/cli.mjs --help

      - name: Pipeline unit tests (task key identity, queue, admission gate)
        run: node --test tests/pipeline/pipeline.test.mjs --test-name-pattern "U[0-9]|G[0-9]"

      - name: Pipeline positive integration tests (P1-P7, owned fixture only)
        run: node --test tests/pipeline/pipeline.test.mjs --test-name-pattern "P[0-9]"
        timeout-minutes: 12

      - name: Pipeline negative integration tests (N1-N8)
        run: node --test tests/pipeline/pipeline.test.mjs --test-name-pattern "N[0-9]"
        timeout-minutes: 8

      - name: Collect pipeline evidence (sanitized)
        if: always()
        run: python tests/pipeline/collect-pipeline-evidence.py

      - name: Upload pipeline evidence (no raw HTML, fonts, cookies or private data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-owned-evidence-${{ github.run_attempt }}
          path: .replica/pipeline-ci-evidence/
          if-no-files-found: warn
          retention-days: 7
