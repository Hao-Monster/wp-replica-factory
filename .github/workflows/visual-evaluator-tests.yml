name: Visual evaluator checks
on: {pull_request: {branches: [main]}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  evaluator:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '24.12.0'}
      - name: Controlled evaluator and tamper tests
        run: node tests/visual-evaluator.mjs
      - name: Framework regression
        run: python -m unittest discover -s tests -v
      - name: Repository file gate
        run: python scripts/check_repo_files.py
      - name: Upload evaluator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-evaluator-evidence
          path: /tmp/visual-evaluator-*/report/reports/
          if-no-files-found: ignore
