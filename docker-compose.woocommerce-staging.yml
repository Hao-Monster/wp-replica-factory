services:
  db:
    image: mariadb:11.4
    environment: {MARIADB_DATABASE: wordpress, MARIADB_USER: wordpress, MARIADB_PASSWORD: wordpress, MARIADB_ROOT_PASSWORD: root}
    tmpfs: [/var/lib/mysql]
  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment: {WORDPRESS_DB_HOST: db, WORDPRESS_DB_USER: wordpress, WORDPRESS_DB_PASSWORD: wordpress, WORDPRESS_DB_NAME: wordpress, WORDPRESS_DEBUG: '0'}
    volumes: ["wpdata:/var/www/html"]
volumes: {wpdata: {}}
